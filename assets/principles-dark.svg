<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-label="How I work">
<text x="0" y="22" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="2.4" fill="#F0764A">04</text>
<text x="34" y="22" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" letter-spacing="2.4" fill="#98A096">HOW I WORK</text>
<line x1="0" y1="38" x2="840" y2="38" stroke="#ECE6DA" stroke-opacity="0.16"/><text x="0" y="100" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="60" fill="#F0764A">1</text>
<text x="0" y="140" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="23" letter-spacing="-0.2" fill="#ECE6DA">One person,</text>
<text x="0" y="168" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="23" letter-spacing="-0.2" fill="#ECE6DA">whole product.</text>
<text x="0" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98A096">Research, design, backend,</text>
<text x="0" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98A096">frontend and deployment.</text>
<text x="290" y="100" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="60" fill="#F0764A">2</text>
<text x="290" y="140" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="23" letter-spacing="-0.2" fill="#ECE6DA">By hand first,</text>
<text x="290" y="168" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="23" letter-spacing="-0.2" fill="#ECE6DA">then automated.</text>
<text x="290" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98A096">Do it manually, measure it,</text>
<text x="290" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98A096">and only then automate it.</text>
<text x="580" y="100" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="60" fill="#F0764A">3</text>
<text x="580" y="140" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="23" letter-spacing="-0.2" fill="#ECE6DA">Shipped</text>
<text x="580" y="168" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="23" letter-spacing="-0.2" fill="#ECE6DA">behind gates.</text>
<text x="580" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98A096">Tests, visual checks and real-data</text>
<text x="580" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#98A096">verification before going live.</text>

</svg>